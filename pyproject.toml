[project]
name = "tactics"
version = "0.1.0"
description = "Replay football tracking data with live tactical geometry overlays and grounded AI explanations."
authors = [
    { name = "Mohitoo6", email = "mohitrks6@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "kloppy[pandas]>=3.19.1",
    "matplotlib>=3.11.2",
    "mplsoccer>=1.8.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
